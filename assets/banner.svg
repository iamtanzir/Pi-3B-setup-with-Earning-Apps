<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Pi-3B Setup with Earning Apps — Pi-hole, Honeygain and EarnApp on Raspberry Pi 3B">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#131c2e"/>
      <stop offset="1" stop-color="#1b2740"/>
    </linearGradient>
    <linearGradient id="rasp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#b91c2c"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2c47"/>
      <stop offset="1" stop-color="#24324f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1010" cy="200" r="230" fill="url(#glow)"/>

  <!-- Raspberry logo (stylised) -->
  <g transform="translate(1010,175)">
    <!-- leaves -->
    <path d="M0,-92 C-18,-120 -46,-124 -58,-96 C-30,-104 -12,-100 0,-76 C12,-100 30,-104 58,-96 C46,-124 18,-120 0,-92 Z" fill="#3fb950"/>
    <path d="M0,-76 C-6,-96 -20,-108 -34,-108 C-16,-88 -8,-80 0,-58 C8,-80 16,-88 34,-108 C20,-108 6,-96 0,-76 Z" fill="#2ea043"/>
    <!-- berry body -->
    <path d="M0,-66 C64,-66 96,-24 96,30 C96,86 52,124 0,124 C-52,124 -96,86 -96,30 C-96,-24 -64,-66 0,-66 Z" fill="url(#rasp)"/>
    <!-- seeds -->
    <g fill="#ffd7d7" fill-opacity="0.9">
      <ellipse cx="-46" cy="-18" rx="7" ry="10" transform="rotate(-14 -46 -18)"/>
      <ellipse cx="0"   cy="-26" rx="7" ry="10"/>
      <ellipse cx="46"  cy="-18" rx="7" ry="10" transform="rotate(14 46 -18)"/>
      <ellipse cx="-62" cy="34"  rx="7" ry="10" transform="rotate(-22 -62 34)"/>
      <ellipse cx="-22" cy="28"  rx="7" ry="10"/>
      <ellipse cx="22"  cy="28"  rx="7" ry="10"/>
      <ellipse cx="62"  cy="34"  rx="7" ry="10" transform="rotate(22 62 34)"/>
      <ellipse cx="-38" cy="80"  rx="6" ry="9" transform="rotate(-12 -38 80)"/>
      <ellipse cx="0"   cy="86"  rx="6" ry="9"/>
      <ellipse cx="38"  cy="80"  rx="6" ry="9" transform="rotate(12 38 80)"/>
    </g>
  </g>

  <!-- Text block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="132" font-size="26" letter-spacing="6" fill="#7dd3fc" font-weight="600">RASPBERRY PI 3B</text>
    <text x="70" y="206" font-size="62" font-weight="800" fill="#f8fafc">Pi-3B Setup with</text>
    <text x="70" y="272" font-size="62" font-weight="800" fill="#f8fafc">Earning Apps<tspan fill="#e5484d">.</tspan></text>

    <!-- Chips -->
    <g font-size="19" font-weight="600">
      <rect x="72"  y="306" width="112" height="38" rx="19" fill="url(#chip)" stroke="#e5484d" stroke-opacity="0.6"/>
      <text x="128" y="331" fill="#fda4af" text-anchor="middle">Pi-hole</text>
      <rect x="196" y="306" width="140" height="38" rx="19" fill="url(#chip)" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="266" y="331" fill="#fcd34d" text-anchor="middle">Honeygain</text>
      <rect x="348" y="306" width="124" height="38" rx="19" fill="url(#chip)" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="410" y="331" fill="#6ee7b7" text-anchor="middle">EarnApp</text>
    </g>
  </g>
</svg>
